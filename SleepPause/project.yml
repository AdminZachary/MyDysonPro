name: SleepPause
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    BASE_BUNDLE_ID: com.example.sleeppause   # ← 改成你自己的唯一 ID（只改这里），例如 com.zheng.sleeppause
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # 在 Xcode 里选择你的 Personal Team，或在这里填 Team ID
    CODE_SIGN_STYLE: Automatic
targets:
  SleepPause:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
      - path: WidgetShared
    dependencies:
      - target: SleepPauseWatch
        embed: true
      - target: SleepPauseWidgets       # 小组件 + 实时活动 / 灵动岛
        embed: true
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: CoreBluetooth.framework      # Dyson Zone 模块（可选）
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
      - sdk: UserNotifications.framework
      - sdk: AppIntents.framework
      - sdk: Security.framework
      - sdk: Charts.framework
    settings:
      base:
        PRODUCT_NAME: SleepPause
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        INFOPLIST_FILE: iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: iOS/SleepPause.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  SleepPauseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["Info.plist", "*.entitlements"]
      - path: WidgetShared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_NAME: SleepPauseWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widgets/SleepPauseWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  SleepPauseWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - target: SleepPauseComplications   # 表盘复杂功能 / 智能叠放
        embed: true
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: CoreMotion.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_NAME: SleepPauseWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Watch/SleepPauseWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  SleepPauseComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared/WatchStatusSnapshot.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: SleepPauseComplications
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).watchkitapp.complications
        INFOPLIST_FILE: WatchWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/SleepPauseComplications.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  SleepPause:
    build:
      targets:
        SleepPause: all
        SleepPauseWidgets: all
    run:
      config: Debug
    archive:
      config: Release
  SleepPauseWatch:
    build:
      targets:
        SleepPauseWatch: all
        SleepPauseComplications: all
    run:
      config: Debug
